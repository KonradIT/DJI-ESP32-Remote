; PlatformIO configuration for DJI-Remote (ESP-IDF project)
;
; Uses the pioarduino fork of the espressif32 platform, which ships a current
; ESP-IDF 5.5.x (the official PlatformIO espressif32 platform is stuck on an
; older IDF).  The "stable" release URL always resolves to the latest stable
; pioarduino release.
;
; Build:  pio run -e m5stack-basic-v27
;         pio run -e waveshare-s3-lcd19
; Flash:  pio run -e <env> -t upload
; See docs/platformio.md for details.

[platformio]
; This is a standard ESP-IDF project: the "main" component is the source dir.
src_dir = main
default_envs = m5stack-basic-v27, waveshare-s3-lcd19

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = espidf
; Custom partition table (same file the IDF build uses via
; CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions.csv").
board_build.partitions = partitions.csv
; Match CONFIG_ESPTOOLPY_FLASHMODE_DIO / FLASHFREQ_80M from the sdkconfig
; defaults so esptool upload flags agree with the image header.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
monitor_speed = 115200

; ---------------------------------------------------------------------------
; M5Stack Basic V2.7  (ESP32, 16 MB flash, no PSRAM)
; ---------------------------------------------------------------------------
[env:m5stack-basic-v27]
board = m5stack-core-esp32-16M
; Per-board Kconfig defaults (board selector, NimBLE, display, GPS pins, ...).
; SDKCONFIG_DEFAULTS is resolved by ESP-IDF relative to the project directory.
; It is only applied when the generated per-env config file
; (sdkconfig.m5stack-basic-v27) does not exist yet -- delete that file (or run
; "pio run -e m5stack-basic-v27 -t fullclean") to re-apply the defaults.
;
; COMPONENTS overrides the project's MINIMAL_BUILD (COMPONENTS takes precedence
; in ESP-IDF) to additionally include "__pio_env", a dummy component the
; PlatformIO espidf builder injects and requires; the build stays trimmed to
; "main" + dependencies.  The resulting "MINIMAL_BUILD property is disregarded"
; CMake warning is expected and harmless.
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.m5stack_basic_v27
    "-DCOMPONENTS=main;__pio_env"
; Turn on to enable wire level DUML debugging packet logging
; build_flags = -DDEBUG_DUML_PACKETS=1


; ---------------------------------------------------------------------------
; Waveshare ESP32-S3-LCD-1.9  (ESP32-S3, 16 MB flash, 8 MB OPI PSRAM)
; ---------------------------------------------------------------------------
[env:waveshare-s3-lcd19]
board = esp32-s3-devkitc1-n16r8
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.waveshare_s3_lcd19
    "-DCOMPONENTS=main;__pio_env"
